name: build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - run: gradle assembleDebug --no-daemon
      - name: Collect APKs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/adrenotest.apk
          cp guestgame/build/outputs/apk/debug/guestgame-debug.apk dist/guestgame.apk
      - name: Backup download (zipped)
        uses: actions/upload-artifact@v4
        with:
          name: apks
          path: dist/*.apk
      - name: Publish plain APKs on the Releases page
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest dist/adrenotest.apk dist/guestgame.apk \
            --target "$GITHUB_SHA" --prerelease \
            --title "Latest build" --notes "Built from $GITHUB_SHA"
